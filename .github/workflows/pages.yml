name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplega:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegament.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Activa Pages si cal
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Puja el lloc sencer
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Desplega
        id: desplegament
        uses: actions/deploy-pages@v4
